name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The organisation's shared neutrality check.
  neutrality:
    permissions:
      contents: read
    uses: zaentrum/.github/.github/workflows/neutrality.yml@v1

  build:
    runs-on: ubuntu-latest
    env:
      # The ffmpeg the image ships (Dockerfile): the tests that remux, probe
      # and transcode compare against what it makes, and skip without one.
      FFMPEG_BUILD_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-07-31-14-10/ffmpeg-n7.1.5-12-g1fdbca85aa-linux64-gpl-7.1.tar.xz
      FFMPEG_SHA256: c1e6caf48923dd8e6bc5e54d51ba70c321175b8162ae9c414c392990e72f0e79
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go build ./...
      - run: go vet ./...
      - name: ffmpeg, as the image has it
        run: |
          curl -fsSL "$FFMPEG_BUILD_URL" -o "$RUNNER_TEMP/ffmpeg.tar.xz"
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - run: go test ./...
